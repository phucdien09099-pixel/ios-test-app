workflows:
  ios-test-build:
    name: "Tauri iOS - test build (chan doan)"
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      node: 20.11.0

    scripts:
      - name: Cai Rust toolchain + target iOS
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Cai dependencies frontend (Next.js)
        script: npm install

      - name: Build frontend tinh (next export)
        script: npm run build

      - name: Tao Xcode project cho iOS (tauri ios init)
        script: |
          source "$HOME/.cargo/env"
          npx tauri ios init --ci

      - name: Thu build iOS KHONG SIGNING
        script: |
          source "$HOME/.cargo/env"

          cd src-tauri/gen/apple

          xcodebuild \
            -project app.xcodeproj \
            -scheme app_iOS \
            -configuration Debug \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build || true

          echo "===== TIM SAN PHAM BUILD ====="
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null || true
          find ~/Library/Developer/Xcode/DerivedData -name "*.ipa" 2>/dev/null || true

    artifacts:
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/*.app
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/*.ipa
      - src-tauri/gen/apple/**/*.xcresult/**